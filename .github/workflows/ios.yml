# FinanceFlowKit is a pure Swift package (no UIKit/SwiftUI, no simulator),
# so `swift test` on a bare macOS runner covers the whole domain layer.
# The ios/** path filter, concurrency cancellation, and tight timeout keep
# macOS runner time minimal (macOS minutes are metered at 10x while a repo
# is private; public repos run free).
name: iOS CI

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ios/FinanceFlowKit
    steps:
      - uses: actions/checkout@v5
      # The tests use Swift Testing, which needs a Swift 6+ toolchain.
      - name: Select newest installed Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)/Contents/Developer"
          swift --version
      - name: Run FinanceFlowKit tests
        run: swift test
