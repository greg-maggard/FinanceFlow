name: FinanceFlow
options:
  bundleIdPrefix: com.gregmaggard
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # Local.xcconfig is optional (git-ignored); see README "Run on a device".
  disabledValidations: [missingConfigFiles]

packages:
  FinanceFlowKit:
    path: FinanceFlowKit

targets:
  FinanceFlow:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FinanceFlow
    dependencies:
      - package: FinanceFlowKit
        product: FinanceFlowKit
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    info:
      path: FinanceFlow/Generated-Info.plist
      properties:
        CFBundleDisplayName: FinanceFlow
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gregmaggard.financeflow
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM is not committed; set it in ios/Local.xcconfig
        # (copy Local.xcconfig.example) to sign for a physical device.
